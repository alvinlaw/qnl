[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnl"
version = "0.1.0"
description = "A PIT-disciplined, AI-native research loop for crypto strategies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
qnl = "qnl.service:cli"

[tool.setuptools]
packages = ["qnl"]
